name: targeted-bilinear-mkl-diagnostic
on: [push]
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: 1
      JULIA_NUM_PRECOMPILE_TASKS: 1
      OPENBLAS_NUM_THREADS: 1
      FFTW_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.9'
      - name: Reproduce MKL gradient comparisons
        run: |
          julia --project .github/set_fftw_provider.jl mkl
          julia --project -e 'using Pkg; Pkg.test()'
